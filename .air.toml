root = "."
tmp_dir = "tmp"

[build]
cmd = "CGO_ENABLED=1 go build -o ./tmp/social-mockery ./cmd"
bin = "./tmp/social-mockery"
args_bin = ["start", "--addr", "127.0.0.1:3000", "--db", ":memory:", "--seed", "profiles/example.yaml"]
include_ext = ["go", "yaml"]
exclude_dir = ["tmp", "bin", ".git"]
delay = 500
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
