            },
            "description": ""
          },
          {
            "name": "code_challenge",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Required for desktop PKCE; official desktop guide uses hex-encoded SHA256, not an inferred base64url substitution."
          },
          {
            "name": "code_challenge_method",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "S256"
              ]
            },
            "description": "Required for desktop."
          }
