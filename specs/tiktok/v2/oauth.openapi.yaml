  "components": {
    "securitySchemes": {
      "TikTokOAuth": {
        "type": "oauth2",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "https://www.tiktok.com/v2/auth/authorize/",
            "tokenUrl": "https://open.tiktokapis.com/v2/oauth/token/",
            "refreshUrl": "https://open.tiktokapis.com/v2/oauth/token/",
            "scopes": {
              "user.info.basic": "Basic account identifier, avatar and display name",
              "user.info.profile": "Additional profile fields",
              "user.info.stats": "Profile statistics",
              "video.list": "Read authorized public videos",
              "video.publish": "Direct Post",
              "video.upload": "Upload to creator inbox"
            }
          }
        },
        "description": "Bearer user access token. TikTok authorization uses client_key and comma-separated scopes; endpoint-specific grants and app approval apply."
      }
    },
    "schemas": {
      "OAuthError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "error_description": {
            "type": "string"
          },
          "log_id": {
            "type": "string"
          }
        }
      },
      "AuthorizationCallback": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "scopes": {
            "type": "string"
          },
          "state": {
            "type": "string"
          },
          "error": {
            "type": "string"
          },
          "error_description": {
            "type": "string"
          }
        },
        "description": "Parameters appended to the registered callback URL, not a TikTok JSON API. Validate state and inspect scopes actually granted."
      },
      "AuthorizationCodeGrant": {
        "type": "object",
        "properties": {
          "client_key": {
            "type": "string"
          },
          "client_secret": {
            "type": "string"
          },
          "grant_type": {
            "type": "string",
            "enum": [
              "authorization_code"
            ]
          },
          "code": {
            "type": "string"
          },
          "redirect_uri": {
            "type": "string"
          },
          "code_verifier": {
            "type": "string",
            "description": "Required for mobile and desktop. Use the verifier associated with the authorization request."
          }
        },
        "required": [
          "client_key",
          "client_secret",
          "grant_type",
          "code",
          "redirect_uri"
        ]
      },
      "RefreshTokenGrant": {
        "type": "object",
        "properties": {
          "client_key": {
            "type": "string"
          },
          "client_secret": {
            "type": "string"
          },
          "grant_type": {
            "type": "string",
            "enum": [
              "refresh_token"
            ]
          },
          "refresh_token": {
            "type": "string"
          }
        },
        "required": [
          "client_key",
          "client_secret",
          "grant_type",
          "refresh_token"
        ]
      },
      "UserTokenRequest": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/AuthorizationCodeGrant"
          },
          {
            "$ref": "#/components/schemas/RefreshTokenGrant"
          }
        ]
      },
      "UserToken": {
        "type": "object",
        "properties": {
          "access_token": {
            "type": "string"
          },
          "expires_in": {
            "type": "integer",
            "format": "int64",
            "description": "Seconds until access token expiry; initial documentation value 86400."
          },
          "refresh_token": {
            "type": "string",
            "description": "May rotate on refresh; replace stored value with response."
          },
          "refresh_expires_in": {
            "type": "integer",
            "format": "int64",
            "description": "Seconds remaining; initial refresh lifetime documented as 365 days."
          },
          "open_id": {
            "type": "string"
          },
          "scope": {
            "type": "string",
            "description": "Comma-separated scopes actually granted."
          },
          "token_type": {
            "type": "string",
            "enum": [
              "Bearer"
            ]
          }
        }
      },
      "RevokeRequest": {
        "type": "object",
        "properties": {
          "client_key": {
            "type": "string"
          },
          "client_secret": {
            "type": "string"
          },
          "token": {
            "type": "string",
            "description": "User access token to revoke."
          }
        },
        "required": [
          "client_key",
          "client_secret",
          "token"
        ]
      },
      "QRCodeRequest": {
        "type": "object",
        "properties": {
          "client_key": {
            "type": "string"
          },
          "scope": {
            "type": "string"
          },
          "state": {
            "type": "string"
          }
        },
        "required": [
          "client_key",
          "scope"
        ]
      },
      "QRCodeResponse": {
        "type": "object",
        "properties": {
          "scan_qrcode_url": {
            "type": "string"
          },
          "token": {
            "type": "string"
          }
        }
      },
      "QRCodeStatusRequest": {
        "type": "object",
        "properties": {
          "client_key": {
            "type": "string"
          },
          "client_secret": {
            "type": "string"
          },
          "token": {
            "type": "string"
          }
        },
        "required": [
          "client_key",
          "client_secret",
          "token"
        ]
      },
      "QRCodeStatus": {
        "type": "object",
        "properties": {
          "client_ticket": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "redirect_uri": {
            "type": "string"
          },
          "state": {
            "type": "string"
          }
        },
        "description": "status examples: new, expired, scanned, confirmed, utilised. Table documents code, while confirmed example uses redirect_uri containing code; both retained, neither universally required."
      },
      "UserTokenOutcome": {
        "anyOf": [
          {
            "$ref": "#/components/schemas/UserToken"
          },
          {
            "$ref": "#/components/schemas/OAuthError"
          }
        ],
        "description": "OAuth response fields; source does not establish that success versus failure is distinguished exclusively by HTTP status. Inspect flat error, not error.code."
      },
      "QRCodeResponseOutcome": {
        "anyOf": [
          {
            "$ref": "#/components/schemas/QRCodeResponse"
          },
          {
            "$ref": "#/components/schemas/OAuthError"
          }
        ],
        "description": "OAuth response fields; source does not establish that success versus failure is distinguished exclusively by HTTP status. Inspect flat error, not error.code."
      },
      "QRCodeStatusOutcome": {
        "anyOf": [
          {
            "$ref": "#/components/schemas/QRCodeStatus"
          },
          {
            "$ref": "#/components/schemas/OAuthError"
          }
        ],
        "description": "OAuth response fields; source does not establish that success versus failure is distinguished exclusively by HTTP status. Inspect flat error, not error.code."
      }
    }
