      "get": {
        "operationId": "authorizeTikTok",
        "summary": "Open TikTok user authorization",
        "description": "Interactive browser flow; callback query parameters modeled separately. No claim about a fixed intermediate page status. PKCE is required for desktop; mobile SDK delivery is outside this HTTP interface.",
