          },
          {
            "url": "https://developers.tiktok.com/docs/en/login-kit-desktop",
            "retrieved": "2026-10-18",
            "kind": "official-tiktok-documentation",
            "status": "retrieved-public-documentation"
          }
        ],
        "x-behavior-provenance": "documentation-based",
        "x-simulator-implemented": false,
        "responses": {
          "default": {
            "description": "Interactive sign-in/consent and redirect to registered callback; callback contains code/scopes/state or error/error_description."
          }
        },
        "parameters": [
          {
            "name": "client_key",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": ""
          },
          {
            "name": "response_type",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "code"
              ]
            },
            "description": ""
          },
          {
            "name": "scope",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Comma-separated requested scopes; user can grant only a subset."
          },
          {
            "name": "redirect_uri",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Registered exact callback URI. Web uses HTTPS; desktop uses registered loopback URI with port."
          },
          {
            "name": "state",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Unique unpredictable anti-CSRF value; match callback."
          },
          {
            "name": "disable_auto_auth",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "enum": [
                0,
