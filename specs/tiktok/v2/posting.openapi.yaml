  "components": {
    "securitySchemes": {
      "TikTokOAuth": {
        "type": "oauth2",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "https://www.tiktok.com/v2/auth/authorize/",
            "tokenUrl": "https://open.tiktokapis.com/v2/oauth/token/",
            "refreshUrl": "https://open.tiktokapis.com/v2/oauth/token/",
            "scopes": {
              "user.info.basic": "Basic account identifier, avatar and display name",
              "user.info.profile": "Additional profile fields",
              "user.info.stats": "Profile statistics",
              "video.list": "Read authorized public videos",
              "video.publish": "Direct Post",
              "video.upload": "Upload to creator inbox"
            }
          }
        },
        "description": "Bearer user access token. TikTok authorization uses client_key and comma-separated scopes; endpoint-specific grants and app approval apply."
      }
    },
    "schemas": {
      "APIError": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "description": "ok indicates success; other codes must be handled even when HTTP status is 200."
          },
          "message": {
            "type": "string"
          },
          "log_id": {
            "type": "string",
            "description": "Wire examples and generic error reference use log_id; posting tables also spell logid."
          }
