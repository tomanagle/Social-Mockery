            "type": "integer",
            "format": "int64"
          },
          "chunk_size": {
            "type": "integer",
            "format": "int64"
          },
          "total_chunk_count": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 1000
          }
        },
        "description": "Sequential chunks; normally 5\u201364 MB, final may include trailing bytes up to 128 MB; videos below 5 MB use one whole chunk. total_chunk_count is floor(video_size/chunk_size) per guide; do not infer ceil.",
        "required": [
          "source",
          "video_size",
          "chunk_size",
          "total_chunk_count"
        ]
      },
