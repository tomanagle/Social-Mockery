            "type": "string",
            "description": "HTTPS URL under verified domain/prefix; redirects are unsupported; available through download completion."
          }
        },
        "required": [
          "source",
          "video_url"
        ]
      },
      "FileVideoSource": {
        "type": "object",
        "properties": {
          "source": {
            "type": "string",
            "enum": [
              "FILE_UPLOAD"
            ]
