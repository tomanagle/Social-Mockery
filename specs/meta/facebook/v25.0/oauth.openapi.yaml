  "paths": {
    "/v25.0/dialog/oauth": {
      "get": {
        "operationId": "authorizeFacebook",
        "description": "Browser authorization and permission consent. Requested scopes may be declined; state must be validated by client. App approval, Page grants and Page tasks are independent gates. Code flow is represented; implicit/hybrid responses are outside this slice. Ordinary Facebook Login permits partial permission decline; config_id selects Facebook Login for Business, where all requested permissions are required and at least one supported business permission beyond automatic email/public_profile is needed. Business system-user token configurations are outside this core code-flow slice.",
        "x-behavior-provenance": "documentation-based",
        "x-simulator-implemented": false,
        "x-sources": [
          "https://developers.facebook.com/docs/facebook-login/guides/advanced/manual-flow/",
          "https://developers.facebook.com/documentation/facebook-login/facebook-login-for-business/"
        ],
        "responses": {
          "200": {
            "description": "Provider browser login/consent UI; markup is provider-owned and not standardized."
          },
          "302": {
            "description": "Redirect to registered redirect_uri with code/state, or error=access_denied, error_reason=user_denied and error_description on denial.",
            "headers": {
              "Location": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "client_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "redirect_uri",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "state",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "response_type",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "code"
              ]
            }
          },
          {
            "name": "scope",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Comma-separated requested permissions, not proof of grants. Facebook Login Instagram access uses instagram_basic, not instagram_business_basic."
          },
          {
            "name": "auth_type",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "config_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "display",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "servers": [
          {
            "url": "https://www.facebook.com"
          }
        ],
        "x-consent-products": {
          "facebook-login": {
            "partial-permission-decline": true,
            "rerequest": "auth_type=rerequest re-prompts previously declined permissions.",
            "source": "https://developers.facebook.com/documentation/facebook-login/guides/advanced/manual-flow"
          },
          "facebook-login-for-business": {
            "all-requested-permissions-required": true,
            "automatically-granted": [
              "email",
              "public_profile"
            ],
            "additional-supported-business-permission-required": true,
            "configuration-parameter": "config_id",
            "source": "https://developers.facebook.com/documentation/facebook-login/facebook-login-for-business/"
          },
          "boundary": "The all-or-nothing grant rule is specific to Facebook Login for Business; do not apply it to ordinary Facebook Login. Business Integration System User configurations are documented separately and are not proof every Instagram operation accepts that token type."
        }
      }
    },
