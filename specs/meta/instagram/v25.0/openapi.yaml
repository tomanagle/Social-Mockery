            "type": "string"
          }
        }
      ],
      "get": {
        "operationId": "ListMedia",
        "description": "List published media for an account. Query fields, limit and after are supported.",
        "x-behavior-provenance": {
          "classification": "documentation-based",
          "sources": [
            "https://www.postman.com/meta/instagram/documentation/6yqw8pt/instagram-api",
            "https://github.com/Posty-social/posty.social/blob/fcce90fb6493444c414d3f9e33aae85e2f00b8be/workspaces/libs/platforms/src/instagram/publish.ts"
          ],
          "liveVerified": false,
          "notes": "Supported subset only. Simulator timing, IDs, cursor format and error messages are synthetic."
        },
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MediaList"
                }
              }
            }
          },
          "default": {
            "description": "Graph-style error; individual messages are simulator fixtures",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
