          "id"
        ],
        "properties": {
          "id": {
            "type": "string"
          }
        }
      },
      "CreateMediaRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "access_token": {
            "type": "string"
          },
          "image_url": {
            "type": "string"
          },
          "video_url": {
            "type": "string"
          },
          "media_type": {
            "type": "string"
          },
          "caption": {
            "type": "string"
          }
        }
      },
      "PublishMediaRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "creation_id": {
            "type": "string"
          },
          "access_token": {
            "type": "string"
          }
        },
        "description": "creation_id is required in the merged query/body parameters; it may be supplied in the query instead of the body."
      },
      "ObjectResponse": {
        "type": "object",
        "required": [
          "id"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "username": {
            "type": "string"
          },
          "account_type": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "status_code": {
            "type": "string"
          },
          "caption": {
            "type": "string"
          },
          "media_type": {
            "type": "string"
          },
          "media_product_type": {
            "type": "string"
          },
          "media_url": {
            "type": "string"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "timestamp": {
            "type": "string"
          },
          "permalink": {
            "type": "string"
          }
        }
      },
      "MediaList": {
        "type": "object",
        "required": [
          "data"
        ],
        "properties": {
          "data": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ObjectResponse"
            }
          },
          "paging": {
            "$ref": "#/components/schemas/Paging"
          }
        }
      },
      "Paging": {
        "type": "object",
        "properties": {
          "next": {
            "type": "string"
          },
          "cursors": {
            "type": "object",
            "properties": {
              "after": {
                "type": "string"
              }
            }
          }
        }
      },
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "$ref": "#/components/schemas/GraphError"
          }
        }
      },
      "GraphError": {
        "type": "object",
        "required": [
          "message",
          "type",
          "code"
        ],
        "properties": {
          "message": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "code": {
            "type": "integer"
          },
          "error_subcode": {
            "type": "integer"
          }
        }
      }
