          "sources": [
            "https://www.postman.com/meta/instagram/documentation/6yqw8pt/instagram-api",
            "https://github.com/Posty-social/posty.social/blob/fcce90fb6493444c414d3f9e33aae85e2f00b8be/workspaces/libs/platforms/src/instagram/publish.ts"
