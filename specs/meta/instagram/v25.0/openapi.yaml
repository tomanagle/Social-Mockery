          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "get": {
        "operationId": "GetObject",
        "description": "Fetch account, media container status or published media. Query fields projects the supported fields.",
        "x-behavior-provenance": {
          "classification": "documentation-based",
          "sources": [
            "https://www.postman.com/meta/instagram/documentation/6yqw8pt/instagram-api",
