            "application/octet-stream": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            }
          }
        },
        "description": "Use returned uri. Local source requires raw binary body, offset and file_size headers. Hosted source requires file_url header instead. Same token as initialization. Resume local upload with offset=video_status.uploading_phase.bytes_transferred. The guide does not specify a required Content-Type; octet-stream models raw bytes.",
