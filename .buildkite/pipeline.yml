# Runs on the self-hosted Docker agent provisioned by tomanagle/buildkite-digitalocean.
# The host provides only Git and Docker; Go and the C toolchain come from the pinned image.
env:
  GO_IMAGE: "golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c"

agents:
  queue: "linux-docker"

steps:
  - label: ":golang: Format, generated code and vet"
    key: "static"
    timeout_in_minutes: 20
    command: ".buildkite/go.sh make fmt-check generate-check vet"

  - label: ":test_tube: Tests and benchmark smoke"
    key: "test"
    timeout_in_minutes: 20
    command:
      - ".buildkite/go.sh make test"
      - ".buildkite/go.sh go test -run '^$$' -bench . -benchtime=1x -benchmem ./..."

  - label: ":racing_car: Race tests"
    key: "race"
    timeout_in_minutes: 30
    command: ".buildkite/go.sh make race"

  - label: ":hammer: Build"
    key: "build"
    timeout_in_minutes: 15
    command: ".buildkite/go.sh make build"

  - label: ":docker: Production image and persistent restart"
    key: "docker"
    timeout_in_minutes: 20
    command: ".buildkite/docker-smoke.sh"
